# =============================================
# Configuration Ticketeer Backend
# =============================================

server.port=8080

# ---- Base de données MySQL ----
spring.datasource.url=jdbc:mysql://ticketeer-ticketeer.h.aivencloud.com:27759/defaultdb?ssl-mode=REQUIRED&sslMode=REQUIRED&useSSL=true&requireSSL=true&serverTimezone=Europe/Paris
spring.datasource.username=avnadmin
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ---- JWT ----
jwt.secret=TicketeerSecretKeyPourJWTSuperLongue2024ChangeEnProd
jwt.expiration=86400000

# ---- Logs ----
logging.level.com.ticketeer=DEBUG